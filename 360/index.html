<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>360° Rundgang – Penthouse Wohnung 10</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
<style>
  :root { --bg:#111; --fg:#f4f2ee; --muted:#b9b4ab; --accent:#c8a96a; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  #pano { position:fixed; inset:0; }
  .rooms { position:fixed; top:12px; left:50%; transform:translateX(-50%); display:flex; gap:6px; flex-wrap:wrap; justify-content:center; max-width:calc(100vw - 32px); z-index:5; }
  .rooms button { background:rgba(17,17,17,.62); backdrop-filter:blur(8px); color:var(--fg); border:1px solid rgba(255,255,255,.18); border-radius:999px; padding:7px 13px; font-size:13px; cursor:pointer; }
  .rooms button.on { background:var(--accent); color:#111; border-color:var(--accent); }
  .bar { position:fixed; left:16px; right:16px; bottom:16px; display:flex; gap:10px; align-items:flex-end; justify-content:space-between; pointer-events:none; }
  .title { pointer-events:auto; background:rgba(17,17,17,.62); backdrop-filter:blur(8px); padding:10px 14px; border-radius:10px; max-width:60vw; }
  .title b { display:block; font-size:16px; } .title span { color:var(--muted); font-size:13px; display:block; }
  .thumbs { pointer-events:auto; display:flex; gap:8px; }
  .thumbs button { border:2px solid transparent; padding:0; border-radius:8px; overflow:hidden; cursor:pointer; background:#000; width:96px; height:64px; }
  .thumbs img { width:100%; height:100%; object-fit:cover; display:block; }
  .lb { position:fixed; inset:0; background:rgba(0,0,0,.92); display:none; align-items:center; justify-content:center; z-index:10; }
  .lb.open { display:flex; } .lb img { max-width:96vw; max-height:90vh; border-radius:6px; }
  .lb .x { position:absolute; top:14px; right:18px; color:#fff; font-size:30px; background:none; border:0; cursor:pointer; }
  .hint { position:fixed; top:58px; left:50%; transform:translateX(-50%); background:rgba(17,17,17,.62); padding:6px 12px; border-radius:999px; font-size:13px; color:var(--muted); transition:opacity .6s; white-space:nowrap; }
  /* walk-to hotspot: a ring on the floor with the room name */
  .pnlm-hotspot-base.go { width:54px; height:54px; margin:-27px 0 0 -27px; border-radius:50%; background:rgba(255,255,255,.28); border:3px solid #fff; box-shadow:0 2px 10px rgba(0,0,0,.35); cursor:pointer; }
  .pnlm-hotspot-base.go:hover { background:rgba(200,169,106,.75); }
  .pnlm-hotspot-base.go span { position:absolute; top:60px; left:50%; transform:translateX(-50%); white-space:nowrap; background:rgba(17,17,17,.75); color:#fff; padding:4px 10px; border-radius:999px; font-size:13px; pointer-events:none; }
  @media (max-width:600px) { .thumbs button { width:64px; height:44px; } .title b { font-size:14px; } .title { max-width:50vw; } }
</style>
</head>
<body>
<div id="pano"></div>
<div class="rooms" id="rooms"><button data-s="wohnen">Wohnen · Essen</button><button data-s="kueche">Küche</button><button data-s="terrasse">Dachterrasse</button><button data-s="diele">Diele</button><button data-s="schlafen">Schlafen</button></div>
<div class="hint" id="hint">Ziehen zum Umsehen · Auf die Kreise tippen, um den Raum zu wechseln</div>
<div class="bar">
  <div class="title"><b id="rname">Wohnen · Essen</b><span>Penthouse Wohnung 10 · Visualisierung</span><span style="font-size:11px;opacity:.7">Möbelmodelle: Wayfair LLC, Darmstadt Graphics Group (CC BY 4.0, Khronos glTF Sample Assets)</span></div>
  <div class="thumbs">
    <button title="Foto Wohnbereich" onclick="lbOpen('foto_wohnen.jpg')"><img src="foto_wohnen_thumb.jpg" alt="Wohnbereich"></button>
    <button title="Foto Küche" onclick="lbOpen('foto_kueche.jpg')"><img src="foto_kueche_thumb.jpg" alt="Küche"></button>
  </div>
</div>
<div class="lb" id="lb" onclick="lbClose()"><button class="x" aria-label="Schließen">×</button><img id="lbimg" alt=""></div>
<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
<script>
  function label(div, text) { const s = document.createElement('span'); s.textContent = text; div.appendChild(s); }
  const CFG = {"default": {"firstScene": "wohnen", "autoLoad": true, "sceneFadeDuration": 900, "minHfov": 50, "maxHfov": 115, "showControls": true, "compass": false}, "scenes": {"wohnen": {"title": "Wohnen · Essen", "panorama": "pano_wohnen.jpg", "yaw": -120, "pitch": -4, "hfov": 100, "hotSpots": [{"type": "scene", "sceneId": "kueche", "text": "Küche", "yaw": -107.7, "pitch": -14.6, "cssClass": "go", "createTooltipFunc": label, "createTooltipArgs": "Küche"}, {"type": "scene", "sceneId": "terrasse", "text": "Dachterrasse", "yaw": 178.1, "pitch": -21.8, "cssClass": "go", "createTooltipFunc": label, "createTooltipArgs": "Dachterrasse"}, {"type": "scene", "sceneId": "diele", "text": "Diele", "yaw": 30.1, "pitch": -16.7, "cssClass": "go", "createTooltipFunc": label, "createTooltipArgs": "Diele"}]}, "kueche": {"title": "Küche", "panorama": "pano_kueche.jpg", "yaw": 60, "pitch": -4, "hfov": 100, "hotSpots": [{"type": "scene", "sceneId": "wohnen", "text": "Wohnen", "yaw": 72.3, "pitch": -14.6, "cssClass": "go", "createTooltipFunc": label, "createTooltipArgs": "Wohnen"}, {"type": "scene", "sceneId": "terrasse", "text": "Dachterrasse", "yaw": 150.6, "pitch": -33.2, "cssClass": "go", "createTooltipFunc": label, "createTooltipArgs": "Dachterrasse"}]}, "terrasse": {"title": "Dachterrasse", "panorama": "pano_terrasse.jpg", "yaw": 10, "pitch": -4, "hfov": 100, "hotSpots": [{"type": "scene", "sceneId": "wohnen", "text": "Wohnen", "yaw": 13.4, "pitch": -29.1, "cssClass": "go", "createTooltipFunc": label, "createTooltipArgs": "Wohnen"}, {"type": "scene", "sceneId": "kueche", "text": "Küche", "yaw": -55.9, "pitch": -17.8, "cssClass": "go", "createTooltipFunc": label, "createTooltipArgs": "Küche"}]}, "diele": {"title": "Diele", "panorama": "pano_diele.jpg", "yaw": 60, "pitch": -4, "hfov": 100, "hotSpots": [{"type": "scene", "sceneId": "wohnen", "text": "Wohnen", "yaw": 134.0, "pitch": -29.9, "cssClass": "go", "createTooltipFunc": label, "createTooltipArgs": "Wohnen"}, {"type": "scene", "sceneId": "schlafen", "text": "Schlafen", "yaw": 91.0, "pitch": -22.5, "cssClass": "go", "createTooltipFunc": label, "createTooltipArgs": "Schlafen"}]}, "schlafen": {"title": "Schlafen", "panorama": "pano_schlafen.jpg", "yaw": 60, "pitch": -4, "hfov": 100, "hotSpots": [{"type": "scene", "sceneId": "diele", "text": "Diele", "yaw": -153.4, "pitch": -56.9, "cssClass": "go", "createTooltipFunc": label, "createTooltipArgs": "Diele"}]}}};
  const v = pannellum.viewer('pano', CFG);
  const btns = [...document.querySelectorAll('#rooms button')];
  function mark() { const s = v.getScene(); btns.forEach(b => b.classList.toggle('on', b.dataset.s === s)); document.getElementById('rname').textContent = CFG.scenes[s].title; }
  btns.forEach(b => b.onclick = () => v.loadScene(b.dataset.s));
  v.on('scenechange', () => setTimeout(mark, 50)); v.on('load', mark); mark();
  setTimeout(() => document.getElementById('hint').style.opacity = 0, 7000);
  function lbOpen(src) { document.getElementById('lbimg').src = src; document.getElementById('lb').classList.add('open'); }
  function lbClose() { document.getElementById('lb').classList.remove('open'); }
</script>
</body>
</html>
